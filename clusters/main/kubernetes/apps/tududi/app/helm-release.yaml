---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tududi
  namespace: tududi
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 18.14.5
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      stopAll: false
    resources:
      requests:
        cpu: 25m
    image:
      repository: docker.io/chrisvel/tududi
      pullPolicy: IfNotPresent
      tag: 1.3.0-rc.3@sha256:ee45bc840006d78ce3f1fa323f154d63d9f324e50b9b99d1aa2259585cda610c
    credentials:
      backblaze:
        accessKey: "${B2_ACCESSKEY}"
        bucket: "${B2_BUCKET}"
        encrKey: "${B2_ENCRKEY}"
        secretKey: "${B2_SECRETKEY}"
        type: s3
        url: "${B2_URL}"
    ingress:
      main:
        enabled: true
        ingressClassName: internal
        hosts:
          - host: tududi.${BASE_DOMAIN}
        integrations:
          certManager:
            certificateIssuer: cloudflare-prod
            enabled: true
          homepage:
            enabled: false
          traefik:
            enabled: false
    service:
      main:
        ports:
          main:
            port: 3002
    persistence:
      db:
        enabled: true
        mountPath: "/app/db"
        volsync:
          - name: db
            credentials: backblaze
            type: restic
            dest:
              enabled: false # change to true on restore
              cacheCapacity: 10Gi
            src:
              enabled: true
              cacheCapacity: 10Gi
      uploads:
        enabled: true
        mountPath: "/app/uploads"
        volsync:
          - name: uploads
            credentials: backblaze
            type: restic
            dest:
              enabled: false # change to true on restore
              cacheCapacity: 10Gi
            src:
              enabled: true
              cacheCapacity: 10Gi
    redis:
      enabled: false
    securityContext:
      container: 
        runAsUser: 0
        runAsGroup: 0
        readOnlyRootFilesystem: false
        allowPrivilegeEscalation: true
        # capabilities:
        #  add:
        #    - CHOWN
        #    - FOWNER
        #    - SYS_CHROOT
        #    - MKNOD
      pod:
        supplementalGroups: [1001]
    workload:
      main:
        podSpec:
          containers:
            main:
              probes:
                liveness:
                  type: tcp
                readiness:
                  type: tcp
                startup:
                  type: tcp
              env:
                TUDUDI_USER_EMAIL: "${EMAIL1}"
                TUDUDI_USER_PASSWORD: "${TUDUDI_USER_PASSWORD}"
                TUDUDI_SESSION_SECRET: "${TUDUDI_SESSION_SECRET}"
                TUDUDI_ALLOWED_ORIGINS: "https://tududi.${BASE_DOMAIN}"
                FRONTEND_URL: "https://tududi.${BASE_DOMAIN}"
                # RATE_LIMITING_ENABLED: false
                SWAGGER_ENABLED: true
                DISABLE_TELEGRAM: true
                # ENABLE_EMAIL: true
                # EMAIL_SMTP_HOST: 
                # EMAIL_SMTP_PORT: 
                # EMAIL_SMTP_SECURE: 
                # EMAIL_SMTP_USERNAME: 
                # EMAIL_SMTP_PASSWORD: 
                # EMAIL_FROM_ADDRESS:
                # EMAIL_FROM_NAME:
                # PUID: "568"
                # GUID: "568"
                # DBFILE: