---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyseerr
  namespace: jellyseerr
spec:
  interval: 15m
  chart:
    spec:
      chart: seerr
      version: 16.0.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 30m
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
#  valuesFrom:
#    - kind: ConfigMap
#      name: cluster-config ## Not in the jellyseerr namespace
  values:
    global:
      stopAll: false
    resources:
      requests:
        cpu: 25m
    podOptions:
      hostUsers: true
    credentials:
      backblaze:
        accessKey: "${B2_ACCESSKEY}"
        bucket: "${B2_BUCKET}"
        encrKey: "${B2_ENCRKEY}"
        secretKey: "${B2_SECRETKEY}"
        type: s3
        url: "${B2_URL}"
    ingress:
      main:
        enabled: true
        ingressClassName: internal
        hosts:
          - host: media-requests.${BASE_DOMAIN}
          - host: jellyseerr.${BASE_DOMAIN}
          - host: seerr.${BASE_DOMAIN}
        integrations:
          certManager:
            certificateIssuer: cloudflare-prod
            enabled: true
          homepage:
            enabled: true
            group: "Media"
            widget:
              type: jellyseerr
              custom:
                key: "${JELLYSEER_API_KEY}"
          traefik:
            enabled: false
    persistence:
      config:
        targetSelectAll: true
        volsync:
          - name: config
            type: restic
            credentials: backblaze
            dest:
              enabled: true # enable on restore
            src:
              enabled: true

    migrateImage:
      repository: ghcr.io/ralgar/pgloader
      pullPolicy: IfNotPresent
      tag: pr-1531@sha256:e5ae0b8149058828938d0f14ccc1f793171db8c4c8b69b7b6b45dfd998f0149f

    workload:
      main:
        podSpec:
          containers:
            migrate:
              enabled: false
              imageSelector: migrateImage
              probes:
                liveness:
                  enabled: false
                readiness:
                  enabled: false
                startup:
                  enabled: false
              args:
                - pgloader
                - --with
                - "quote identifiers"
                - --with
                - "data only"
                - /app/config/db.sqlite3
                - "{{ .Values.cnpg.main.creds.std }}"