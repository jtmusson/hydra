---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metube
  namespace: metube
spec:
  interval: 15m
  chart:
    spec:
      chart: metube
      version: 19.2.5
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 15m
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      stopAll: false
    resources:
      requests:
        cpu: 50m
        memory: 2Gi
      limits:
        cpu: 2000m
        memory: 6Gi
    credentials:
      backblaze:
        accessKey: "${B2_ACCESSKEY}"
        bucket: "${B2_BUCKET}"
        encrKey: "${B2_ENCRKEY}"
        secretKey: "${B2_SECRETKEY}"
        type: s3
        url: "${B2_URL}"
    ingress:
      main:
        enabled: true
        ingressClassName: internal
        hosts:
          - host: metube.${BASE_DOMAIN}
        integrations:
          certManager:
            certificateIssuer: cloudflare-prod
            enabled: true
          homepage:
            enabled: true
            group: Ripping
            widget:
              enabled: false
          traefik:
            enabled: false
    persistence:
      config:
        volsync:
          - name: config-2
            credentials: backblaze
            type: restic
            dest:
              enabled: true
            src:
              enabled: true
      downloads:
        path: "${PATH_MOVIES}/_MakeMKV_Out"
        server: "${PLUTO_IP}"
        type: nfs
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                DEFAULT_THEME: "dark"
                OUTPUT_TEMPLATE: "%(title)s [%(id)s].%(ext)s"
                OUTPUT_TEMPLATE_PLAYLIST: ""
                OUTPUT_TEMPLATE_CHANNEL: ""
                YTDL_OPTIONS: '{"max_filesize":6000000000,"ratelimit":20000000,"writesubtitles":true,"subtitleslangs":["en","-live_chat"],"updatetime":false,"cachedir":"/tmp/yt-dlp-cache","postprocessors":[{"key":"FFmpegEmbedSubtitle","already_have_subtitle":false},{"key":"FFmpegMetadata","add_chapters":true}]}'
                MAX_CONCURRENT_DOWNLOADS: "1"
                CLEAR_COMPLETED_AFTER: "604800" # 1 week in seconds
                TEMP_DIR: "/downloads/.tmp"
                CORS_ALLOWED_ORIGINS: "https://metube.${BASE_DOMAIN},https://www.youtube.com"