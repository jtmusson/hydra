---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mussoncraft
  namespace: mussoncraft
spec:
  interval: 15m
  chart:
    spec:
      chart: minecraft-bedrock
      version: 15.2.2
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      stopAll: false # change to 'true' to stop all pods whenever world maintenance is needed
    image:
      repository: ghcr.io/itzg/minecraft-bedrock-server
      pullPolicy: IfNotPresent
      tag: 2026.11.0@sha256:0d8799379a492bd636037587298fa8a77ee409264fd77a3c68dba55104dbcca0
    resources:
      requests:
        cpu: 50m
    podOptions:
      terminationGracePeriodSeconds: 90
    credentials:
      backblaze:
        accessKey: "${B2_ACCESSKEY}"
        bucket: "${B2_BUCKET}"
        encrKey: "${B2_ENCRKEY}"
        secretKey: "${B2_SECRETKEY}"
        type: s3
        url: "${B2_URL}"  
    persistence:
      config:
        enabled: true
        volsync:
          - name: config
            credentials: backblaze
            type: restic
            dest:
              enabled: true
            src:
              enabled: true
              trigger:
                schedule: 20 0 * * *
      worlds:
        enabled: true
        path: "${PATH_MINECRAFT}"
        server: "${PLUTO_IP}"
        type: nfs
        mountPath: "/data/worlds"
    service:
      main:
        enabled: true
        annotations:
          external-dns.alpha.kubernetes.io/hostname: "mc-survival.${BASE_DOMAIN_EXT}"
          external-dns.kubernetes.io/hostname: "mc-survival.${BASE_DOMAIN_EXT}"
        loadBalancerIP: "${MUSSONCRAFT_IP}"
        type: LoadBalancer
        integrations:
          metallb:
            enabled: true
        ports:
          main:
            enabled: true
            primary: true
            port: 19132
            protocol: tcp
          # one UDP port per connected client
          udp-19140: { enabled: true, port: 19140, protocol: udp }
          udp-19141: { enabled: true, port: 19141, protocol: udp }
          udp-19142: { enabled: true, port: 19142, protocol: udp }
          udp-19143: { enabled: true, port: 19143, protocol: udp }
          udp-19144: { enabled: true, port: 19144, protocol: udp }
          udp-19145: { enabled: true, port: 19145, protocol: udp }
          udp-19146: { enabled: true, port: 19146, protocol: udp }
          udp-19147: { enabled: true, port: 19147, protocol: udp }
          udp-19148: { enabled: true, port: 19148, protocol: udp }
          udp-19149: { enabled: true, port: 19149, protocol: udp }
          udp-19150: { enabled: true, port: 19150, protocol: udp }
          udp-19151: { enabled: true, port: 19151, protocol: udp }
          udp-19152: { enabled: true, port: 19152, protocol: udp }
          udp-19153: { enabled: true, port: 19153, protocol: udp }
          udp-19154: { enabled: true, port: 19154, protocol: udp }
          udp-19155: { enabled: true, port: 19155, protocol: udp }
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                # renovate: datasource=custom.minecraft-bedrock depName=minecraft-bedrock
                VERSION: 1.26.63.1
                TRANSPORT: nethernet
                SERVER_UDP_PORTS: "{{ .Values.service.main.loadBalancerIP }}:19140-19155:19140-19155"
                ALLOW_CHEATS: false
                DIFFICULTY: normal
                GAMEMODE: survival
                LEVEL_NAME: "Mussoncraft"
                ONLINE_MODE: true
                MAX_PLAYERS: 8
                MAX_THREADS: 0
                DEFAULT_PLAYER_PERMISSION_LEVEL: "member"
                # DO NOT SET false: this forces BDS to bind 19132/19133, including
                # NetherNet's TCP listener. false == nothing on 19132 == total outage.
                # https://learn.microsoft.com/en-us/minecraft/creator/documents/bedrockserver/server-properties
                ENABLE_LAN_VISIBILITY: true
                SERVER_NAME: "Mussoncraft"
                VIEW_DISTANCE: 32
                PLAYER_IDLE_TIMEOUT: 0
                WHITE_LIST: true # set because source chart sets to false otherwise
                ALLOW_LIST: true
                ALLOW_LIST_USERS: "${MINECRAFT_ALLOW_LIST_USERS}"
                CONTENT_LOG_CONSOLE_OUTPUT_ENABLED: false
                STOP_SERVER_ANNOUNCE_DELAY: 60
              probes:
                startup:
                  type: tcp
                liveness:
                  type: tcp
                readiness:
                  type: http
                  path: /v1/join
                  port: 19132
