---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: longhorn-pod-cleaner
  namespace: longhorn-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: longhorn-pod-cleaner
  namespace: longhorn-system
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: longhorn-pod-cleaner
  namespace: longhorn-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: longhorn-pod-cleaner
subjects:
  - kind: ServiceAccount
    name: longhorn-pod-cleaner
    namespace: longhorn-system
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: longhorn-pod-cleanup
  namespace: longhorn-system
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: longhorn-pod-cleaner
          restartPolicy: OnFailure
          containers:
            - name: kubectl
              image: oci.trueforge.org/containerforge/kubectl:1.31.1@sha256:99f35bf9124b7d172cf24d32a51497c09625edec8fcb04d03dfccec789fe6778
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  echo "Deleting failed pods in longhorn-system..."
                  kubectl -n longhorn-system delete pods --field-selector=status.phase=Failed --ignore-not-found=true
                  echo "Done."
      ttlSecondsAfterFinished: 120