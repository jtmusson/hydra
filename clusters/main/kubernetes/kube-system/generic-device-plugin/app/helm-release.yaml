---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: generic-device-plugin
  namespace: kube-system
spec:
  interval: 15m
  chart:
    spec:
      chart: generic-device-plugin
      version: 3.7.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      stopAll: false
    podOptions:
      nodeSelector:
        kubernetes.io/hostname: "k8s-control-1"
    resources:
      requests:
        cpu: 10m
    image:
      repository: ghcr.io/squat/generic-device-plugin
      tag: 0.2.0@sha256:66c8d5c270eb2b721f1064c549b9b7898152a6d2f0163380a5d37dc7636c20ff
    workload:
      main:
        podSpec:      
          containers:
            main:
              args:
                - --domain
                - musson.uk
                - --device
                - |
                  name: optical
                  groups: 
                    - paths: # NOTE: device numbering may change if a device is added or removed from the system
                      - path: /dev/sr0
                      - path: /dev/sg0