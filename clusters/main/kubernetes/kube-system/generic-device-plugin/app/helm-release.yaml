---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: generic-device-plugin
  namespace: kube-system
spec:
  interval: 15m
  chart:
    spec:
      chart: generic-device-plugin
      version: 3.0.4
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      stopAll: false
    podOptions:
      nodeSelector:
        kubernetes.io/hostname: "k8s-control-1"
    resources:
      requests:
        cpu: 10m
    image:
      tag: 0.1.0@sha256:66e03b1f9975a79fa17f5a87ea4f0c71467bbb71f50c76841eec8b0c5f41e8c1
    workload:
      main:
        podSpec:      
          containers:
            main:
              args:
                - --domain
                - musson.uk
                - --device
                - |
                  name: optical
                  groups: 
                    - paths: # NOTE: device numbering may change if a device is added or removed from the system
                      - path: /dev/sr0
                      - path: /dev/sg0